<div class="board-container">

  <!-- Header -->
  <div class="board-header">
    <div class="header-left">
      <h1>My Tasks</h1>
      <span class="task-count">{{ filtered.length }} tasks</span>
    </div>
    <div class="header-right">
      <input
        [(ngModel)]="searchQuery"
        class="search-input"
        placeholder="Search tasks..." />

      <select [(ngModel)]="filterPriority" class="filter-select">
        <option value="all">All priorities</option>
        <option value="high">High</option>
        <option value="med">Medium</option>
        <option value="low">Low</option>
      </select>

      <!-- Voice Button -->
      <button class="btn-voice" [class.listening]="isListening" (click)="startVoice()">
        {{ isListening ? 'Listening...' : 'Voice Command' }}
      </button>

      <!-- Notification Dropdown -->
      <div class="notification-container">
        <button class="btn-notification" (click)="toggleNotificationsDropdown()">
          🔔
          <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>
        
        <div class="notification-dropdown" *ngIf="showNotificationsDropdown">
          <div class="dropdown-header">
            <h3>Notifications</h3>
            <button class="btn-clear" (click)="clearAllNotifications()">Clear All</button>
          </div>
          <div class="dropdown-list">
            <div *ngIf="notifications.length === 0" class="empty-notifications">
              No notifications yet.
            </div>
            <div *ngFor="let notification of notifications" class="notification-item" [class.unread]="!notification.read">
              <div class="notification-item-header">
                <span class="notification-dot" *ngIf="!notification.read"></span>
                <strong>{{ notification.title }}</strong>
                <span class="notification-time">{{ notification.createdAt | date: 'MMM d, h:mm a' }}</span>
              </div>
              <p class="notification-message">{{ notification.message }}</p>
              <div class="notification-item-actions">
                <button *ngIf="!notification.read" class="btn-read" (click)="markNotificationAsRead(notification)">Mark read</button>
                <button class="btn-delete-notif" (click)="deleteNotification(notification)">✕</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-add" (click)="showAddModal = true">Add Task</button>
    </div>
  </div>

  <!-- Kanban Columns -->
  <div class="kanban-board">

    <div class="column col-todo">
      <div class="col-header">
        <span class="col-dot dot-todo"></span>
        <span class="col-title">To Do</span>
        <span class="col-badge">{{ todoTasks.length }}</span>
      </div>
      <app-task-card
        *ngFor="let task of todoTasks"
        [task]="task"
        (onToggle)="toggleDone($event)"
        (onDelete)="deleteTask($event)">
      </app-task-card>
    </div>

    <div class="column col-inprog">
      <div class="col-header">
        <span class="col-dot dot-inprog"></span>
        <span class="col-title">In Progress</span>
        <span class="col-badge">{{ inprogTasks.length }}</span>
      </div>
      <app-task-card
        *ngFor="let task of inprogTasks"
        [task]="task"
        (onToggle)="toggleDone($event)"
        (onDelete)="deleteTask($event)">
      </app-task-card>
    </div>

    <div class="column col-done">
      <div class="col-header">
        <span class="col-dot dot-done"></span>
        <span class="col-title">Done</span>
        <span class="col-badge">{{ doneTasks.length }}</span>
      </div>
      <app-task-card
        *ngFor="let task of doneTasks"
        [task]="task"
        (onToggle)="toggleDone($event)"
        (onDelete)="deleteTask($event)">
      </app-task-card>
    </div>

  </div>

  <!-- Add Task Modal -->
  <div class="modal-overlay" *ngIf="showAddModal" (click)="showAddModal = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h2>New Task</h2>

      <div class="form-group">
        <label>Title</label>
        <input [(ngModel)]="newTask.title" placeholder="Task title" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="newTask.description" placeholder="Details..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select [(ngModel)]="newTask.priority">
            <option value="high">High</option>
            <option value="med">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select [(ngModel)]="newTask.status">
            <option value="todo">To Do</option>
            <option value="inprog">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <input [(ngModel)]="newTask.category" placeholder="e.g. Work" />
        </div>
        <div class="form-group">
          <label>Due Date & Time</label>
          <input [(ngModel)]="newTask.dueDate" type="datetime-local" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" (click)="showAddModal = false">Cancel</button>
        <button class="btn-save" (click)="addTask()">Save Task</button>
      </div>
    </div>
  </div>

</div>
